<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright sky-blue base. Sky-400 territory throughout — luminous,
         day-time feel, not the deep night-sky of the previous pass. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DC8FF"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- Sun-glow bloom: pure #B8E1FF lifting the top-left corner into
         near-white, like sunlight catching the tile. -->
    <radialGradient id="bloom" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.25" stop-color="#B8E1FF" stop-opacity="0.55"/>
      <stop offset="0.6"  stop-color="#7DC8FF" stop-opacity="0.15"/>
      <stop offset="1"    stop-color="#7DC8FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft bottom-right shade just to give the tile dimensionality
         without going dark. Stays in the sky-blue family. -->
    <radialGradient id="shade" cx="0.85" cy="0.88" r="0.55">
      <stop offset="0" stop-color="#0369a1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#bloom)"/>
  <rect width="128" height="128" rx="30" fill="url(#shade)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="29.5"
        fill="none" stroke="url(#edge)" stroke-width="1"/>

  <g transform="rotate(-6 64 64)" filter="url(#cardShadow)">
    <rect x="36" y="34" width="56" height="64" rx="9" fill="url(#card)"/>
    <rect x="44" y="48" width="34" height="5" rx="2.5" fill="#0369a1" opacity="0.92"/>
    <rect x="44" y="60" width="40" height="4" rx="2" fill="#0EA5E9" opacity="0.6"/>
    <rect x="44" y="70" width="28" height="4" rx="2" fill="#0EA5E9" opacity="0.6"/>
    <rect x="44" y="80" width="36" height="4" rx="2" fill="#0EA5E9" opacity="0.6"/>
  </g>
</svg>
